$base: "http://oeap.github.io/schema#"

$namespaces:
  cwl: "https://w3id.org/cwl/cwl#"

$graph:
# Import the CWL v1.2 schema; adjust if you target another version
- $import: https://github.com/common-workflow-language/cwl-v1.2/raw/main/CommonWorkflowLanguage.yml

- name: JSONSchemaHint
  type: record
  extends: cwl:ProcessRequirement
  inVocab: false
  doc: "Indicates that a process requires a JSON Schema validation."
  fields:
  - name: class
    type: string
    doc: "Always 'JSONSchemaHint'"
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"

- name: RegoPolicyHint
  type: record
  extends: cwl:ProcessRequirement
  inVocab: false
  doc: "Indicates that a process requires a Rego Policy validation."
  fields:
  - name: class
    type: string
    doc: "Always 'RegoPolicyHint'"
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"
  - name: module
    type: string
    doc: |
      The [Rego](https://www.openpolicyagent.org/docs/policy-language) module to load.
  - name: queries
    type:
      type: array
      items: string
    jsonldPredicate: "http://oeap.github.io/schema#queries"
    doc: |
      List of [Rego](https://www.openpolicyagent.org/docs/policy-language) queries to evaluate.

- name: Cql2Query
  type: record
  inVocab: false
  doc: "Represents a single CQL2 query and an associated message."
  fields:
  - name: class
    type: string
    doc: "Always 'Cql2Query'"
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"
  - name: id
    type: string
    doc: "A unique assertion identified."
    jsonldPredicate: "@id"
  - name: cql2
    type: Any
    doc: |
      The [Common Query Language (CQL2)](https://www.ogc.org/standards/cql2/) text or JSON encoded filter.
  - name: message
    type: string
    doc: "The reported error message, when the assertion fails." 

- name: Cql2FilterHint
  type: record
  extends: cwl:ProcessRequirement
  inVocab: false
  doc: "Indicates that a process requires a CQL2-based validation."
  fields:
  - name: class
    type: string
    doc: "Always 'Cql2FilterHint'"
    jsonldPredicate:
      _id: "@type"
      _type: "@vocab"
  - name: custom_functions
    type: string?
    doc: "Optional Python custom function(s) definition that can be invoked in the evalautor"
  - name: queries
    type:
      type: array
      items: Cql2Query   # or 'string' if you want plain strings
    jsonldPredicate: "http://oeap.github.io/schema#queries"
    doc: |
      The [Common Query Language (CQL2)](https://www.ogc.org/standards/cql2/) filters.
