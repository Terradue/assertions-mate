version: '3'

includes:
  quality: https://raw.githubusercontent.com/Terradue/taskfile-utils/refs/heads/main/quality.yaml

tasks:

  default:
    cmds:
    - task: quality:test
    - task: quality:check

  docs:serve:
    desc: "Serve MkDocs site using hatch docs environment"
    cmds:
      - |
        set -euo pipefail
        HATCH_DATA_DIR="$PWD/.task/hatch" hatch run docs:serve
